<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songa Learning Resource Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="site-header">
            <h1>Songa Learning Resource Explorer</h1>
            <p class="intro">Explore resources, learn new skills, and keep track of your progress.</p>
    </header>

    <main class="container">
        <section class="controls panel" >
                <label for="search-input">Search resources</label>
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search by title or description ..."
                >

                <label for="category-filter">Filter by category</label>
                <select id="category-filter">
                    <option value="all">All categories</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="CSS">CSS</option>
                    <option value="Git &amp; GitHub">Git & GitHub</option>
                    <option value="Career Skills">Career Skills</option>
                </select>
        </section>

        <section class="progress-grid" >
                <p id="resource-count" class="progress-number">Resources: 0</p>
                <p id="completed-count" class="progress-number">Completed: 0</p>
        </section>

        <section class="resources-section">
                    <h2>Learning resources</h2>
            <div id="resource-list" class="resource-grid" aria-live="polite"></div>
            <p id="empty-message" class="empty-message" hidden>
                No resources match your search. Try another search or category.
            </p>
        </section>
    </main>
</body>
</html>
